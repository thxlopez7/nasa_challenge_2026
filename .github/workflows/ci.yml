name: ExoVitals CI

on:
  push:
    branches: ['**', '!main']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Canonical contract guard
        run: npm run check:contracts

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Vitest suite with coverage
        run: npm run test:coverage

      - name: Production Next.js build
        run: npm run build
